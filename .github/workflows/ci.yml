name: CI

on:
  # 기준 브랜치와 상관없이 모든 PR에서 돈다 — 앞 PR 위에 쌓은 PR(기준이 기능 브랜치)도 열리자마자 검사받는다.
  pull_request:
  workflow_dispatch:

# 같은 PR(또는 같은 브랜치의 수동 실행)에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
